<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EduGenie - AI Learning Assistant
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

    <main class="app-shell">


        <!-- HERO -->

        <header class="hero">

            <div class="badge">
                AI LEARNING ASSISTANT
            </div>

            <h1>
                EduGenie
            </h1>

            <p>
                Learn faster with AI-powered
                explanations, answers, quizzes,
                summaries and learning paths.
            </p>

        </header>


        <!-- INPUT CARD -->

        <section class="card">

            <label for="task">
                Choose a task
            </label>


            <select id="task">

                <option value="qa">
                    Ask a Question
                </option>

                <option value="explain">
                    Explain a Topic
                </option>

                <option value="quiz">
                    Generate Quiz
                </option>

                <option value="summarize">
                    Summarize Text
                </option>

                <option value="learn">
                    Learning Path
                </option>

            </select>


            <label for="inputText">
                Your input
            </label>


            <textarea
                id="inputText"
                rows="10"
                placeholder="Example: Explain the Pythagoras theorem in simple language."
            ></textarea>


            <div class="actions">

                <button
                    id="sampleBtn"
                    class="secondary"
                >
                    Load Example
                </button>


                <button
                    id="submitBtn"
                >
                    Ask EduGenie
                </button>

            </div>


            <div
                id="status"
                class="status"
                aria-live="polite"
            ></div>

        </section>


        <!-- RESULT -->

        <section
            id="resultCard"
            class="card result-card hidden"
        >

            <div class="result-heading">

                <h2>
                    Result
                </h2>

                <button
                    id="copyBtn"
                    class="copy-btn"
                >
                    Copy
                </button>

            </div>


            <div id="result"></div>

        </section>


        <!-- FOOTER -->

        <footer>

            <span>
                EduGenie
            </span>

            <span>
                FastAPI + Google Gemini
            </span>

        </footer>


    </main>


    <script
        src="{{ url_for('static', path='js/app.js') }}"
    ></script>

</body>

</html>
